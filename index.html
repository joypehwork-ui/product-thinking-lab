<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Thinking Lab</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#16181d; --muted:#5f6672; --line:#e3e6ea;
  --accent:#2f5bd0; --accent-soft:#eaf0ff; --good:#12795e; --good-soft:#e5f5ef;
  --bad:#b32d3b; --bad-soft:#fdecee; --warn:#8a5a00; --warn-soft:#fff4e0;
  --radius:12px; --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1115; --panel:#171a20; --ink:#e9ecf1; --muted:#9aa3b0; --line:#272c35;
    --accent:#7d9dfb; --accent-soft:#1c2436; --good:#4bd6a8; --good-soft:#122a23;
    --bad:#ff8b96; --bad-soft:#2c1418; --warn:#f0c069; --warn-soft:#2b2213;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
h1,h2,h3,h4,h5{line-height:1.25;margin:0}
p{margin:0 0 .85em}
p:last-child{margin-bottom:0}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.9em;
  background:var(--accent-soft);padding:.1em .35em;border-radius:4px}

.wrap{max-width:1140px;margin:0 auto;padding-block:24px;padding-left:20px;padding-right:20px}
header.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.brand h1{font-size:26px;letter-spacing:-.4px}
.brand p{color:var(--muted);font-size:13.5px;margin:4px 0 0}
.progwrap{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);
  border-radius:999px;padding:8px 14px 8px 10px;box-shadow:var(--shadow)}
.ring{width:38px;height:38px;flex:0 0 38px;border-radius:50%;display:grid;place-items:center;
  font-size:11px;font-weight:700;background:conic-gradient(var(--accent) var(--pct,0%),var(--line) 0)}
.ring span{width:28px;height:28px;border-radius:50%;background:var(--panel);display:grid;place-items:center}
.progwrap small{color:var(--muted);font-size:12px;display:block}
.progwrap b{font-size:13px}

.layout{display:grid;grid-template-columns:250px 1fr;gap:22px;align-items:start}
nav.side{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:8px;box-shadow:var(--shadow);position:sticky;top:20px}
nav.side button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;
  background:none;color:var(--ink);font:inherit;font-size:13.5px;padding:9px 10px;border-radius:8px;cursor:pointer}
nav.side button:hover{background:var(--accent-soft)}
nav.side button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:650}
nav.side .num{flex:0 0 22px;height:22px;border-radius:50%;border:1px solid var(--line);
  display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted);background:var(--bg)}
nav.side button[data-done="1"] .num{background:var(--good-soft);border-color:transparent;color:var(--good)}
.resetbtn{margin-top:6px;border-top:1px solid var(--line);padding-top:6px}

main{min-width:0}
section.mod{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:26px;box-shadow:var(--shadow)}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:700}
section.mod>h2{font-size:23px;letter-spacing:-.3px;margin:6px 0 10px}
.lede{color:var(--muted);font-size:15.5px;margin-bottom:22px}

.card{border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:16px 0;background:var(--bg)}
.card h4{font-size:14.5px;margin-bottom:6px}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;
  background:var(--accent-soft);color:var(--accent);margin-bottom:8px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:16px 0}
.grid3 .card{margin:0}
.quote{border-left:3px solid var(--accent);padding:2px 0 2px 14px;color:var(--muted);font-style:italic;margin:16px 0}
.exercise{border:1px solid var(--accent);border-radius:10px;padding:18px;margin:22px 0 8px;background:var(--panel)}
.exercise>h3{font-size:16px;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.exercise>h3::before{content:"\25C6";color:var(--accent);font-size:12px}
.exercise .task{color:var(--muted);font-size:13.5px;margin-bottom:16px}
.score{font-size:13px;font-weight:650;color:var(--muted);margin-top:14px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.tblwrap{overflow-x:auto;margin:16px 0}

button.btn{font:inherit;font-size:13.5px;font-weight:600;border-radius:8px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);padding:7px 14px;cursor:pointer}
button.btn:hover{border-color:var(--accent);color:var(--accent)}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.btn.primary:hover{filter:brightness(1.08);color:#fff}
button.btn:disabled{opacity:.5;cursor:default}
textarea,input[type=text]{font:inherit;font-size:14px;width:100%;padding:9px 11px;border-radius:8px;
  border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
label.fl{display:block;font-size:12.5px;font-weight:650;margin:14px 0 5px}
label.fl em{font-weight:400;color:var(--muted);font-style:normal}
.rowbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}

.sortitem{border:1px solid var(--line);border-radius:9px;padding:12px 14px;margin-bottom:10px;background:var(--bg)}
.sortitem p{font-size:14px;margin:0 0 10px}
.sortitem .opts{display:flex;flex-wrap:wrap;gap:7px}
.fb{font-size:13px;margin-top:10px;padding:9px 11px;border-radius:7px;line-height:1.5}
.fb.ok{background:var(--good-soft);color:var(--good)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.fb.info{background:var(--accent-soft);color:var(--accent)}
.fb.warn{background:var(--warn-soft);color:var(--warn)}
.fb b{font-weight:750}
button.opt{font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);cursor:pointer}
button.opt:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
button.opt[data-state=picked-ok]{background:var(--good-soft);border-color:var(--good);color:var(--good)}
button.opt[data-state=picked-no]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
button.opt[data-state=reveal]{border-color:var(--good);color:var(--good);border-style:dashed}
button.opt:disabled{cursor:default}

.whyrow{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.whyrow .tag{flex:0 0 64px;font-size:11.5px;font-weight:700;color:var(--muted);padding-top:11px}
.whyrow .tag.sym{color:var(--accent)}

.mapgrid{display:grid;grid-template-columns:70px 1fr 1fr;gap:8px;margin:16px 0}
.mapgrid .hd{font-size:11.5px;font-weight:700;color:var(--muted);text-align:center;align-self:center}
.mapgrid .yl{font-size:11.5px;font-weight:700;color:var(--muted);writing-mode:vertical-rl;
  transform:rotate(180deg);text-align:center;justify-self:center;align-self:center}
.quad{border:1px dashed var(--line);border-radius:9px;padding:10px;min-height:110px;background:var(--bg)}
.quad h5{font-size:12px;margin:0 0 8px;color:var(--muted);font-weight:700}
.quad.hot{border-color:var(--accent);border-style:solid;background:var(--accent-soft)}
.chip{display:block;width:100%;text-align:left;font:inherit;font-size:12.5px;padding:7px 9px;margin-bottom:6px;
  border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.chip small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.tray{border:1px solid var(--line);border-radius:9px;padding:10px;background:var(--bg);margin-bottom:12px}
.tray h5{font-size:12px;margin:0 0 8px;color:var(--muted);font-weight:700}

.jrow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border:1px solid var(--line);
  border-radius:9px;padding:11px 13px;margin-bottom:9px;background:var(--bg)}
.jrow p{font-size:13.5px;margin:0}

.q{border-top:1px solid var(--line);padding:18px 0}
.q:first-of-type{border-top:0}
.q>p.stem{font-size:14.5px;font-weight:600;margin-bottom:12px}
.q .opts{display:flex;flex-direction:column;gap:7px}
.q button.opt{text-align:left;border-radius:8px;padding:9px 12px;font-size:13.5px}
.result{margin-top:20px;padding:16px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:14px}
.result b{display:block;font-size:17px;margin-bottom:4px}
.footnav{display:flex;justify-content:space-between;gap:10px;margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.src{color:var(--muted);font-size:12px;margin-top:18px;text-align:center}
.src a{color:var(--muted)}
@media (max-width:800px){
  .layout{grid-template-columns:1fr}
  nav.side{position:static}
  nav.side .list{display:flex;overflow-x:auto;gap:4px}
  nav.side button{white-space:nowrap;width:auto}
  .resetbtn{border-top:0;padding-top:0;margin-top:0}
  section.mod{padding:20px 16px}
  .mapgrid{grid-template-columns:1fr}
  .mapgrid .yl,.mapgrid .hd{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Product Thinking Lab</h1>
      <p>Seven hands-on modules &mdash; define the right problem before you build the solution.</p>
    </div>
    <div class="progwrap">
      <div class="ring" id="ring"><span id="ringtxt">0%</span></div>
      <div><b id="progtxt">0 of 7 done</b><small>Progress saves in this browser</small></div>
    </div>
  </header>

  <div class="layout">
    <nav class="side">
      <div class="list" id="nav"></div>
      <div class="resetbtn"><button class="btn" id="reset" style="width:100%;border:0;background:none;color:var(--muted);font-size:12px">Reset all progress</button></div>
    </nav>
    <main id="main"></main>
  </div>

  <p class="src">Structure adapted from the Institute of Digital Government Product Thinking pathway &mdash;
    <a href="https://www.idg.gov.sg/product-thinking/" target="_blank" rel="noopener">idg.gov.sg/product-thinking</a>.
    Worked examples are illustrative.</p>
</div>

<script>
/* ============================== state ============================== */
var KEY = 'ptlab.v1';
var state = load();
function load(){
  try { var r = JSON.parse(localStorage.getItem(KEY)); if (r && typeof r === 'object') return r; } catch(e){}
  return { done:{}, notes:{} };
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
function markDone(id){ state.done[id] = true; save(); paintNav(); }
function note(k,v){ state.notes[k] = v; save(); }

/* ============================== helpers ============================== */
function el(tag, attrs, kids){
  var n = document.createElement(tag);
  if (attrs) for (var k in attrs){
    if (k === 'html') n.innerHTML = attrs[k];
    else if (k === 'text') n.textContent = attrs[k];
    else if (k === 'on') for (var ev in attrs.on) n.addEventListener(ev, attrs.on[ev]);
    else n.setAttribute(k, attrs[k]);
  }
  (kids || []).forEach(function(c){ if (c) n.appendChild(c); });
  return n;
}
function h(tag, cls, html){ return el(tag, cls ? {'class':cls, html:html||''} : {html:html||''}); }
function fb(kind, html){ return el('div', {'class':'fb ' + kind, html:html}); }

/* A click-to-answer question block. opts = [{t:label, ok:bool, why:string}] */
function mcq(stem, opts, onAnswered){
  var wrap = el('div', {'class':'sortitem'});
  wrap.appendChild(el('p', {html:stem}));
  var row = el('div', {'class':'opts'});
  var out = el('div');
  var answered = false;
  opts.forEach(function(o){
    var b = el('button', {'class':'opt', type:'button', text:o.t});
    b.addEventListener('click', function(){
      if (answered) return;
      answered = true;
      row.querySelectorAll('button').forEach(function(x){ x.disabled = true; });
      b.setAttribute('data-state', o.ok ? 'picked-ok' : 'picked-no');
      if (!o.ok) row.querySelectorAll('button').forEach(function(x, i){
        if (opts[i].ok) x.setAttribute('data-state','reveal');
      });
      out.appendChild(fb(o.ok ? 'ok' : 'no', (o.ok ? '<b>Yes.</b> ' : '<b>Not quite.</b> ') + o.why));
      if (onAnswered) onAnswered(!!o.ok);
    });
    row.appendChild(b);
  });
  wrap.appendChild(row); wrap.appendChild(out);
  return wrap;
}

/* Runs a set of mcqs and tracks a score line */
function quizSet(container, items, doneId, passNote){
  var scored = 0, answered = 0;
  var line = el('p', {'class':'score', text:'0 of ' + items.length + ' answered'});
  items.forEach(function(it){
    container.appendChild(mcq(it.stem, it.opts, function(ok){
      answered++; if (ok) scored++;
      line.textContent = answered + ' of ' + items.length + ' answered — ' + scored + ' right';
      if (answered === items.length){
        line.textContent += '. ' + (passNote || '');
        if (doneId) markDone(doneId);
      }
    }));
  });
  container.appendChild(line);
}

function exercise(title, task){
  var e = el('div', {'class':'exercise'});
  e.appendChild(el('h3', {text:title}));
  e.appendChild(el('p', {'class':'task', html:task}));
  return e;
}

/* ============================== modules ============================== */
var MODULES = [];

/* ---------- 1. Understanding the Problem ---------- */
MODULES.push({ id:'m1', title:'Understanding the Problem', build:function(){
  var s = el('section', {'class':'mod'});
  s.appendChild(el('div', {'class':'eyebrow', text:'Module 1'}));
  s.appendChild(el('h2', {text:'Understanding the Problem'}));
  s.appendChild(el('p', {'class':'lede', html:'Product thinking is the habit of framing a challenge properly <em>before</em> deciding what to build. It rests on three foundations.'}));

  var g = el('div', {'class':'grid3'});
  [ ['Problems before solutions','A solution named too early becomes the goal. &ldquo;We need a chatbot&rdquo; is an answer pretending to be a question &mdash; it forecloses every cheaper option.'],
    ['Outcomes over outputs','Success is the <b>change achieved</b>, not the features delivered. A shipped feature nobody uses is a cost, not a win.'],
    ['Policy&ndash;Ops&ndash;Tech integration','A digital service is only as good as the policy behind it and the operations around it. Fix all three, or the tech absorbs the blame.']
  ].forEach(function(c){
    var card = el('div', {'class':'card'});
    card.appendChild(el('h4', {html:c[0]}));
    card.appendChild(el('p', {html:c[1]}));
    g.appendChild(card);
  });
  s.appendChild(g);

  s.appendChild(el('div', {'class':'quote', html:'&ldquo;Product thinking is a discipline of asking better questions.&rdquo;'}));

  var ex = exercise('Solution in disguise?',
    'Each line below arrived in a real-sounding project request. Decide whether it states a <b>problem</b> worth investigating, or a <b>solution</b> that has skipped the problem.');
  quizSet(ex, [
    { stem:'&ldquo;We need an AI chatbot for the enquiry hotline.&rdquo;',
      opts:[
        {t:'Problem', ok:false, why:'This names a technology, not a difficulty. It does not say who struggles, with what, or how badly. Ask: what is going wrong on the hotline today?'},
        {t:'Solution', ok:true, why:'A specific build has already been chosen. The problem &mdash; long waits? repeat questions? officers overloaded? &mdash; is still unstated, so you cannot tell whether a chatbot is the cheapest fix or the most expensive one.'}
      ]},
    { stem:'&ldquo;62% of hotline calls last quarter were the same five questions, and average wait time hit 14 minutes.&rdquo;',
      opts:[
        {t:'Problem', ok:true, why:'It is observable, quantified, and points at a pattern rather than a build. Several solutions now compete on merit: better web copy, an FAQ, callbacks, staffing, or automation.'},
        {t:'Solution', ok:false, why:'No solution is named here. It is evidence about what is going wrong &mdash; exactly what a problem statement should carry.'}
      ]},
    { stem:'&ldquo;Officers spend about 3 hours a week re-keying data that already exists in another system, and errors from re-keying cause roughly 40 case reworks a month.&rdquo;',
      opts:[
        {t:'Problem', ok:true, why:'Time cost, error cost, and a plausible mechanism &mdash; all without prescribing an integration, an RPA bot, or a form redesign. Those come later, and can be compared.'},
        {t:'Solution', ok:false, why:'Nothing is being built yet. This is the kind of framing that lets you choose between three or four options instead of defending one.'}
      ]},
    { stem:'&ldquo;Let us build a dashboard so management has visibility.&rdquo;',
      opts:[
        {t:'Problem', ok:false, why:'&ldquo;Visibility&rdquo; is a vague benefit, not a problem. Which decision is being made badly today, by whom, and what would they do differently with the number?'},
        {t:'Solution', ok:true, why:'A classic output-shaped request. Dashboards are cheap to build and easy to ignore; without a named decision they usually become the second kind.'}
      ]}
  ], 'm1', 'Notice the pattern: problems carry evidence, solutions carry nouns.');
  s.appendChild(ex);
  return s;
}});

/* ---------- 2. 4Cs problem statement ---------- */
MODULES.push({ id:'m2', title:'Craft a Clear Problem Statement', build:function(){
  var s = el('section', {'class':'mod'});
  s.appendChild(el('div', {'class':'eyebrow', text:'Module 2'}));
  s.appendChild(el('h2', {text:'Craft a Clear Problem Statement'}));
  s.appendChild(el('p', {'class':'lede', html:'The <b>4Cs</b> give a problem statement everything a reviewer needs to say yes, no, or &ldquo;not yet&rdquo; &mdash; without you being in the room.'}));

  var tw = el('div', {'class':'tblwrap'});
  tw.innerHTML = '<table><thead><tr><th style="width:110px">The C</th><th>What it answers</th><th>Fails when&hellip;</th></tr></thead><tbody>' +
    '<tr><td><b>Clarity</b></td><td>Who is affected, and what specifically is hard for them? Stated plainly, no solution named.</td><td>It describes a feature, or an audience so broad it means everyone.</td></tr>' +
    '<tr><td><b>Consequence</b></td><td>So what? What does the problem cost in time, money, trust, or risk if nothing changes?</td><td>The cost is asserted but never sized &mdash; &ldquo;inefficient&rdquo;, &ldquo;frustrating&rdquo;.</td></tr>' +
    '<tr><td><b>Cause</b></td><td>Why does it happen? The mechanism, not the symptom.</td><td>The cause is really a person to blame, or just the symptom restated.</td></tr>' +
    '<tr><td><b>Confirmation</b></td><td>How do you know? The evidence, and how you would recognise the problem as solved.</td><td>The only evidence is that somebody senior said so.</td></tr>' +
    '</tbody></table>';
  s.appendChild(tw);

  /* --- worked pair --- */
  var ex0 = exercise('Two statements, same project', 'One of these will survive a steering committee. Read both, then pick.');
  var pair = el('div', {'class':'grid3'});
  var a = el('div', {'class':'card'});
  a.innerHTML = '<span class="pill">Statement A</span><p>&ldquo;Our permit application process is inefficient and frustrating for businesses. We should modernise it with an AI assistant to improve the user experience.&rdquo;</p>';
  var b = el('div', {'class':'card'});
  b.innerHTML = '<span class="pill">Statement B</span><p>&ldquo;First-time applicants for a food-shop licence abandon the online form midway 41% of the time (2,340 of 5,700 starts last year). Each abandonment turns into an average of 1.8 hotline calls, and 22% of those applicants restart from scratch, delaying opening by two to three weeks. Exit surveys and six observed sessions point to one cause: applicants cannot tell which of the 14 supporting documents apply to their case, so they stop to check and never return. We would know this is solved if abandonment falls below 20% without a rise in incomplete submissions.&rdquo;</p>';
  pair.appendChild(a); pair.appendChild(b);
  ex0.appendChild(pair);
  quizSet(ex0, [
    { stem:'Statement A fails mostly on which C?',
      opts:[
        {t:'Clarity only', ok:false, why:'Clarity is weak, but it is not the only gap. There is no sized cost, no mechanism, and no evidence &mdash; A misses three of the four.'},
        {t:'Consequence, Cause and Confirmation', ok:true, why:'&ldquo;Inefficient and frustrating&rdquo; sizes nothing, no mechanism is offered, and no evidence is cited. It also names a solution (an AI assistant) before the problem is understood.'},
        {t:'Nothing &mdash; it is just shorter', ok:false, why:'Length is not the difference. A could be three times longer and still tell you nothing you could act on or verify.'}
      ]},
    { stem:'In Statement B, which phrase is doing the <b>Cause</b> work?',
      opts:[
        {t:'&ldquo;abandon the online form midway 41% of the time&rdquo;', ok:false, why:'That is Confirmation &mdash; the evidence that a problem exists. It tells you what is happening, not why.'},
        {t:'&ldquo;applicants cannot tell which of the 14 supporting documents apply to their case&rdquo;', ok:true, why:'That is the mechanism: a specific, checkable reason the abandonment happens. It is also the part that suggests fixes &mdash; conditional questions, a document checker, plain-English guidance &mdash; none of which needed to be named in the statement.'},
        {t:'&ldquo;delaying opening by two to three weeks&rdquo;', ok:false, why:'That is Consequence &mdash; the cost to the business of the problem persisting.'}
      ]}
  ], null, '');
  s.appendChild(ex0);

  /* --- builder --- */
  var ex = exercise('Build your own', 'Use a challenge from your own work. Fill in all four boxes, then run the check. Your draft is saved in this browser.');
  var fields = [
    ['clarity','Clarity', 'Who is affected, and what exactly is hard for them?', 'Officers in&hellip; / Applicants who&hellip; struggle to&hellip;'],
    ['consequence','Consequence', 'What does it cost if nothing changes? Put a number on it.', 'This costs roughly&hellip; hours / cases / dollars per&hellip;'],
    ['cause','Cause', 'Why does it happen? Describe the mechanism, not a person.', 'This happens because&hellip;'],
    ['confirmation','Confirmation', 'What is your evidence, and what would &ldquo;solved&rdquo; look like?', 'We know from&hellip; We would consider this solved when&hellip;']
  ];
  var inputs = {};
  fields.forEach(function(f){
    var lab = el('label', {'class':'fl', html:f[1] + ' &nbsp;<em>' + f[2] + '</em>'});
    var ta = el('textarea', {rows:'2', placeholder:f[3]});
    ta.value = (state.notes['4c_' + f[0]] || '');
    ta.addEventListener('input', function(){ note('4c_' + f[0], ta.value); });
    inputs[f[0]] = ta;
    ex.appendChild(lab); ex.appendChild(ta);
  });
  var out = el('div');
  var solutionWords = ['chatbot','app','dashboard','portal','platform','ai ','a.i.','automate','automation','system to','rpa','llm','website redesign','build a','implement a'];
  var btns = el('div', {'class':'rowbtns'});
  btns.appendChild(el('button', {'class':'btn primary', type:'button', text:'Check my statement', on:{click:function(){
    out.innerHTML = '';
    var v = {}; fields.forEach(function(f){ v[f[0]] = inputs[f[0]].value.trim(); });
    var pass = 0, checks = [];

    if (v.clarity.length < 25) checks.push(['no','<b>Clarity</b> is thin. Name the group and the specific difficulty &mdash; a reader who knows nothing about your area should picture the same situation you do.']);
    else {
      var found = solutionWords.filter(function(w){ return v.clarity.toLowerCase().indexOf(w) > -1; });
      if (found.length) checks.push(['warn','<b>Clarity</b> may have a solution smuggled in (&ldquo;' + found[0].trim() + '&rdquo;). Try describing the difficulty so well that two different solutions could both answer it.']);
      else { checks.push(['ok','<b>Clarity</b> reads as a difficulty rather than a build.']); pass++; }
    }

    if (/\d/.test(v.consequence)) { checks.push(['ok','<b>Consequence</b> is sized &mdash; there is a number a reviewer can argue with. That is what you want.']); pass++; }
    else checks.push(['no','<b>Consequence</b> has no magnitude. &ldquo;Slow&rdquo; and &ldquo;frustrating&rdquo; cannot be prioritised against other work. Estimate: how many people, how often, how many hours or dollars? A rough figure you can defend beats no figure.']);

    if (v.cause.length < 20) checks.push(['no','<b>Cause</b> is missing. Without a mechanism you are guessing at fixes. Module 3 has the tool for this.']);
    else if (/\b(lazy|careless|forgot|forget|did not bother|incompetent|staff are|officers are bad)\b/i.test(v.cause))
      checks.push(['warn','<b>Cause</b> points at people. &ldquo;Someone forgot&rdquo; is where a Five Whys should <em>continue</em>, not stop &mdash; why was forgetting possible, and why did nothing catch it?']);
    else { checks.push(['ok','<b>Cause</b> describes a mechanism.']); pass++; }

    var hasEvidence = /(data|survey|interview|log|ticket|observ|audit|report|feedback|study|from the|%|\d)/i.test(v.confirmation);
    var hasTarget = /(solved|success|when |below|above|reduce|fall|drop|increase|target|no longer)/i.test(v.confirmation);
    if (hasEvidence && hasTarget) { checks.push(['ok','<b>Confirmation</b> has both halves: where the evidence comes from, and what &ldquo;solved&rdquo; looks like.']); pass++; }
    else if (hasEvidence) checks.push(['warn','<b>Confirmation</b> cites evidence but sets no finish line. Add the condition that would let you say this is done.']);
    else checks.push(['no','<b>Confirmation</b> needs a source. How do you know this is real and not anecdote &mdash; logs, tickets, interviews, a survey, an audit?']);

    checks.forEach(function(c){ out.appendChild(fb(c[0], c[1])); });
    out.appendChild(el('p', {'class':'score', text:pass + ' of 4 Cs are solid.'}));
    if (pass >= 3) markDone('m2');
  }}}));
  btns.appendChild(el('button', {'class':'btn', type:'button', text:'Assemble into one paragraph', on:{click:function(){
    out.innerHTML = '';
    var v = fields.map(function(f){ return inputs[f[0]].value.trim(); }).filter(Boolean);
    if (!v.length) { out.appendChild(fb('info','Fill in a box or two first.')); return; }
    var card = el('div', {'class':'card'});
    card.appendChild(el('span', {'class':'pill', text:'Your problem statement'}));
    card.appendChild(el('p', {text:v.join(' ')}));
    out.appendChild(card);
    out.appendChild(fb('info','Read it aloud. If a colleague could not repeat the problem back to you without using the word &ldquo;system&rdquo;, tighten Clarity.'));
  }}}));
  ex.appendChild(btns); ex.appendChild(out);
  s.appendChild(ex);
  return s;
}});

/* ---------- 3. Five Whys ---------- */
MODULES.push({ id:'m3', title:'Start With The Whys', build:function(){
  var s = el('section', {'class':'mod'});
  s.appendChild(el('div', {'class':'eyebrow', text:'Module 3'}));
  s.appendChild(el('h2', {text:'Start With The Whys'}));
  s.appendChild(el('p', {'class':'lede', html:'Ask &ldquo;why&rdquo; roughly five times to travel from the symptom you noticed to the cause you can actually change. Fixes aimed at symptoms come back.'}));

  var c1 = el('div', {'class':'card'});
  c1.innerHTML = '<h4>Three ways a Five Whys goes wrong</h4>' +
    '<p><b>It stops at a person.</b> &ldquo;The officer forgot to check&rdquo; is a symptom of a process that allows forgetting. Keep going: why was there nothing to catch it?</p>' +
    '<p><b>It stops at the first fixable thing.</b> Convenient causes are seductive. If the fix feels suspiciously easy, ask why once more.</p>' +
    '<p><b>It becomes a single chain when the problem has several.</b> Real causes branch. Follow the branch with the most evidence behind it, and write down the ones you set aside.</p>';
  s.appendChild(c1);

  var ex1 = exercise('Walk a real chain',
    'A worked example. At each step, choose the answer that moves you closer to a cause you could design against.');
  var chain = el('div');
  chain.appendChild(fb('info','<b>Symptom:</b> 30% of grant applications are returned to applicants for missing or wrong information.'));
  ex1.appendChild(chain);
  quizSet(ex1, [
    { stem:'<b>Why 1</b> &mdash; why are so many applications returned?',
      opts:[
        {t:'Applicants are careless', ok:false, why:'A judgement, not a cause. If 30% of people make the same mistake, the form is a better suspect than the people. Restate it as behaviour you can observe.'},
        {t:'Applicants submit the wrong income documents', ok:true, why:'Observable and specific. Now you have something to interrogate.'}
      ]},
    { stem:'<b>Why 2</b> &mdash; why do they submit the wrong income documents?',
      opts:[
        {t:'The form asks for &ldquo;proof of income&rdquo; without saying which documents count', ok:true, why:'A concrete gap in the artefact itself. Keep pulling.'},
        {t:'They did not read the instructions', ok:false, why:'Almost always true and almost never useful. Ask instead why the instructions failed to land &mdash; where they sat, how long they were, whether they matched the applicant’s case.'}
      ]},
    { stem:'<b>Why 3</b> &mdash; why is the wording that vague?',
      opts:[
        {t:'Nobody has updated the form in years', ok:false, why:'Getting warmer, but this is about age, not mechanism. Why has nobody updated it? That is the question with a cause behind it.'},
        {t:'It was copied from the legislation, which is deliberately broad to cover many income types', ok:true, why:'Now the policy layer appears. The vagueness is not an oversight &mdash; it is inherited, and that changes who needs to be in the room.'}
      ]},
    { stem:'<b>Why 4</b> &mdash; why was legislative language put straight onto an applicant-facing form?',
      opts:[
        {t:'Because there is no step where policy wording is translated for the public, and legal sign-off is the only review the form gets', ok:true, why:'This is a cause you can design against: a missing translation step and a review process that optimises for legal accuracy alone. Note that the fix is partly operational, not technical &mdash; Policy&ndash;Ops&ndash;Tech in one line.'},
        {t:'Because the form builder tool has a character limit', ok:false, why:'A plausible constraint, but it would explain brevity, not vagueness. Test it before you build on it; if it is false you will have designed for the wrong world.'}
      ]},
    { stem:'You could stop here. What is the strongest reason to ask <b>Why 5</b>?',
      opts:[
        {t:'To confirm the count reaches five', ok:false, why:'Five is a rule of thumb, not a quota. Stop when you reach something you can change and own &mdash; sometimes that is three, sometimes seven.'},
        {t:'To find out why no feedback loop existed, since 30% returns should have surfaced on its own', ok:true, why:'The sharpest question in the whole chain. A problem this size stayed invisible, which means there is a second problem &mdash; nobody was watching the return rate. Fix only the form and you will be blind to the next one.'}
      ]}
  ], null, '');
  s.appendChild(ex1);

  var ex2 = exercise('Your turn', 'Take a problem from your own work. Write the symptom, then push through five whys. Look at your last line: could you write a task for it tomorrow? If not, keep going.');
  var rows = ['sym','w1','w2','w3','w4','w5'];
  var labels = ['Symptom','Why 1','Why 2','Why 3','Why 4','Why 5'];
  rows.forEach(function(r, i){
    var row = el('div', {'class':'whyrow'});
    row.appendChild(el('div', {'class':'tag' + (i === 0 ? ' sym' : ''), text:labels[i]}));
    var inp = el('input', {type:'text', placeholder: i === 0 ? 'What did you observe?' : 'Because…'});
    inp.value = state.notes['why_' + r] || '';
    inp.addEventListener('input', function(){ note('why_' + r, inp.value); });
    row.appendChild(inp);
    ex2.appendChild(row);
  });
  var o2 = el('div');
  ex2.appendChild(el('div', {'class':'rowbtns'}, [
    el('button', {'class':'btn primary', type:'button', text:'Check my chain', on:{click:function(){
      o2.innerHTML = '';
      var vals = rows.map(function(r){ return (state.notes['why_' + r] || '').trim(); });
      var filled = vals.filter(Boolean).length;
      if (filled < 4) { o2.appendChild(fb('info','Get at least the symptom and three whys down &mdash; the interesting causes usually appear at three or four.')); return; }
      var last = vals.filter(Boolean).pop();
      if (/\b(lazy|careless|forgot|forget|stupid|incompetent|did not care|didn’t care|not trained)\b/i.test(last))
        o2.appendChild(fb('warn','Your last why lands on a person. That is a stopping point disguised as an answer &mdash; ask why the mistake was <em>possible</em>, and why nothing caught it.'));
      else if (last.length < 15)
        o2.appendChild(fb('warn','The last link is very short. Causes worth acting on usually need a clause: <em>because X, so Y cannot happen</em>.'));
      else
        o2.appendChild(fb('ok','That reads like a mechanism. Final test: name one thing you could change on Monday because of it. If you can, you have found a root cause; if you cannot, there is one more why in there.'));
      if (vals[0] && filled >= 5) markDone('m3');
      o2.appendChild(fb('info','Also worth writing down: the branches you did <em>not</em> follow. They are your next hypotheses if the first fix disappoints.'));
    }}})
  ]));
  ex2.appendChild(o2);
  s.appendChild(ex2);
  return s;
}});

/* ---------- 4. Metrics ---------- */
MODULES.push({ id:'m4', title:'Metrics', build:function(){
  var s = el('section', {'class':'mod'});
  s.appendChild(el('div', {'class':'eyebrow', text:'Module 4'}));
  s.appendChild(el('h2', {text:'Metrics'}));
  s.appendChild(el('p', {'class':'lede', html:'Choose measurements that reflect real outcomes, not just activity. The test: if this number went up and nothing else changed, would anyone be better off?'}));

  var tw = el('div', {'class':'tblwrap'});
  tw.innerHTML = '<table><thead><tr><th style="width:120px">Kind</th><th>What it measures</th><th>Example</th></tr></thead><tbody>' +
    '<tr><td><b>Output</b></td><td>What you produced. Fully under your control, which is why it feels safe to report.</td><td>Chatbot launched; 40 FAQs written; 12 workshops run.</td></tr>' +
    '<tr><td><b>Adoption</b></td><td>Whether anyone showed up. Necessary, but not yet a benefit.</td><td>8,000 chatbot sessions; 3,000 officers attended.</td></tr>' +
    '<tr><td><b>Outcome</b></td><td>The change in someone’s situation. What you were actually funded for.</td><td>Hotline volume down 35%; median licence approval 9 days &rarr; 4.</td></tr>' +
    '<tr><td><b>Guardrail</b></td><td>The harm you would cause by chasing the outcome too hard. Pair every target with one.</td><td>Appeal rate; error rate; satisfaction of applicants who still need a human.</td></tr>' +
    '</tbody></table>';
  s.appendChild(tw);

  var ex = exercise('Sort the measures', 'For each measure, pick the label that fits best.');
  quizSet(ex, [
    { stem:'&ldquo;3,000 officers completed the data literacy course.&rdquo;',
      opts:[
        {t:'Output / adoption', ok:true, why:'It counts attendance. Useful for delivery tracking, but it says nothing about whether anyone works differently now. The outcome would be something like: share of teams whose decisions cite data they pulled themselves.'},
        {t:'Outcome', ok:false, why:'Completion is not change. You could hit this number with a course everyone clicked through and forgot &mdash; which is exactly the failure mode it hides.'}
      ]},
    { stem:'&ldquo;Median time from application to approval fell from 9 days to 4.&rdquo;',
      opts:[
        {t:'Outcome', ok:true, why:'Someone’s situation is measurably different, and it is stated as a median rather than a mean &mdash; harder to flatter with outliers.'},
        {t:'Output', ok:false, why:'You did not produce &ldquo;4 days&rdquo;; it is the effect of what you produced. That distinction is the whole module.'}
      ]},
    { stem:'&ldquo;Chatbot sessions grew 200% quarter on quarter, while hotline call volume stayed flat.&rdquo;',
      opts:[
        {t:'Strong adoption, and evidence the outcome is not happening', ok:true, why:'Exactly. Usage rose without displacing the thing it was meant to displace &mdash; so either it serves different people, or it fails and they call anyway. Adoption without outcome is the most commonly declared false victory in digital government.'},
        {t:'Proof the chatbot is working', ok:false, why:'Careful. The stated aim was to reduce calls; calls did not move. Growth in sessions is real activity, but on its own it may just be extra work for the same demand.'}
      ]},
    { stem:'Your target is &ldquo;increase digital form submissions by 50%&rdquo;. Which guardrail best protects against gaming it?',
      opts:[
        {t:'Total page views on the form', ok:false, why:'That moves in the same direction as the target, so it cannot warn you about anything. A guardrail must be able to contradict your headline number.'},
        {t:'Rate of incomplete or rejected submissions, plus satisfaction among people who could not finish', ok:true, why:'Right. You can hit +50% by pushing people to submit anything, or by closing the phone channel on those who cannot cope online. This pair makes both failures visible.'},
        {t:'Number of new features shipped to the form', ok:false, why:'An output. It tells you how busy the team was, not whether the target was reached honestly.'}
      ]}
  ], 'm4', 'Rule of thumb: one outcome metric, one guardrail, and only then your output counts.');
  s.appendChild(ex);
  return s;
}});

/* ---------- 5. Assumptions and Risks ---------- */
MODULES.push({ id:'m5', title:'Assumptions and Risks', build:function(){
  var s = el('section', {'class':'mod'});
  s.appendChild(el('div', {'class':'eyebrow', text:'Module 5'}));
  s.appendChild(el('h2', {text:'Assumptions and Risks'}));
  s.appendChild(el('p', {'class':'lede', html:'Every plan rests on things you believe but have not checked. Surface them early, then test the ones that would hurt most if wrong &mdash; while changing course is still cheap.'}));

  var c = el('div', {'class':'card'});
  c.innerHTML = '<h4>Sort by impact, then by evidence</h4><p>Plot each assumption on two axes: <b>how badly it hurts if wrong</b>, and <b>how much evidence you have</b>. The top-left quadrant &mdash; high impact, little evidence &mdash; is your <b>riskiest assumption</b>. Test that first, with the smallest thing that could tell you the truth. Everything else can wait.</p>';
  s.appendChild(c);

  var ex = exercise('Map the assumptions',
    'A team is building an AI assistant that drafts replies to public enquiries. Click an assumption, then click the quadrant you would put it in. Get all five placed to see how the team should have sequenced its work.');

  var items = [
    { id:'a1', t:'Officers will trust an AI-drafted reply enough to send it', ev:'low', im:'high',
      why:'This is the riskiest one. Nothing works if drafts go unused, and the team has no evidence &mdash; trust in AI output is exactly what teams assume rather than test. A one-week test with five officers and a pile of real enquiries would settle it before a line of production code.' },
    { id:'a2', t:'Enough historical enquiry-and-reply pairs exist to work from', ev:'low', im:'high',
      why:'Also high impact, low evidence &mdash; and cheap to check, which makes it embarrassing to skip. One afternoon in the data settles a question that can end the project. Check it this week.' },
    { id:'a3', t:'Officers have laptops that can run the tool', ev:'high', im:'high',
      why:'High impact, but you already know the answer from asset records. No test needed &mdash; just confirm and move on. Assumptions like this feel productive to discuss and are pure delay.' },
    { id:'a4', t:'Officers prefer a side panel to a pop-out window', ev:'low', im:'low',
      why:'Genuinely unknown, but cheap to change later and unlikely to sink anything. This is a decision to defer, not a risk to test &mdash; teams that test this first are avoiding the scary questions.' },
    { id:'a5', t:'Replies must still be checked by a human before sending', ev:'high', im:'high',
      why:'High impact, but this is a known policy requirement, not an assumption &mdash; you have the evidence. Treat it as a design constraint from day one rather than something to validate.' }
  ];
  var placed = {};

  var tray = el('div', {'class':'tray'});
  tray.appendChild(el('h5', {text:'ASSUMPTIONS — click to pick one up'}));
  var sel = null;

  var quads = {};
  function quad(key, title, hot){
    var q = el('div', {'class':'quad' + (hot ? ' hot' : '')});
    q.appendChild(el('h5', {html:title}));
    var body = el('div');
    q.appendChild(body);
    q.addEventListener('click', function(){
      if (!sel) return;
      placed[sel.id] = key;
      sel = null;
      render();
    });
    quads[key] = body;
    return q;
  }

  var grid = el('div', {'class':'mapgrid'});
  var outMap = el('div');

  function render(){
    tray.querySelectorAll('button').forEach(function(b){ b.remove(); });
    items.forEach(function(it){
      if (placed[it.id]) return;
      var b = el('button', {'class':'chip' + (sel && sel.id === it.id ? ' sel' : ''), type:'button', text:it.t});
      b.addEventListener('click', function(e){ e.stopPropagation(); sel = (sel && sel.id === it.id) ? null : it; render(); });
      tray.appendChild(b);
    });
    for (var k in quads) quads[k].innerHTML = '';
    items.forEach(function(it){
      var k = placed[it.id];
      if (!k) return;
      var correct = (it.im === 'high' ? 'h' : 'l') + (it.ev === 'low' ? 'l' : 'h');
      var b = el('button', {'class':'chip', type:'button'});
      b.innerHTML = (k === correct ? '✓ ' : '↺ ') + it.t +
        (k === correct ? '' : '<small>Not where the team would put it — click to take it back.</small>');
      b.addEventListener('click', function(e){ e.stopPropagation(); delete placed[it.id]; sel = null; render(); });
      quads[k].appendChild(b);
    });
    var all = items.every(function(it){ return placed[it.id] === (it.im === 'high' ? 'h' : 'l') + (it.ev === 'low' ? 'l' : 'h'); });
    outMap.innerHTML = '';
    if (all){
      outMap.appendChild(fb('ok','<b>All five placed correctly.</b> Read the quadrants as an order of work, not a scoreboard.'));
      items.forEach(function(it){
        var d = el('div', {'class':'card'});
        d.innerHTML = '<h4>' + it.t + '</h4><p>' + it.why + '</p>';
        outMap.appendChild(d);
      });
      outMap.appendChild(fb('info','<b>The lesson in the layout:</b> only two of these five deserve a test. High impact with strong evidence is a constraint to design around; low impact with weak evidence is a decision to defer. Testing is for the top-left corner &mdash; and you test it with the cheapest thing that could prove you wrong, not with a pilot.'));
      markDone('m5');
    } else if (sel){
      outMap.appendChild(fb('info','Holding: <b>' + sel.t + '</b> &mdash; now click a quadrant.'));
    }
  }

  grid.appendChild(el('div'));
  grid.appendChild(el('div', {'class':'hd', html:'Little evidence'}));
  grid.appendChild(el('div', {'class':'hd', html:'Strong evidence'}));
  grid.appendChild(el('div', {'class':'yl', text:'HIGH IMPACT'}));
  grid.appendChild(quad('hl', 'Riskiest — test first', true));
  grid.appendChild(quad('hh', 'Known constraint — design for it'));
  grid.appendChild(el('div', {'class':'yl', text:'LOW IMPACT'}));
  grid.appendChild(quad('ll', 'Defer — decide later, cheaply'));
  grid.appendChild(quad('lh', 'Ignore — settled and minor'));

  ex.appendChild(tray);
  ex.appendChild(grid);
  ex.appendChild(outMap);
  render();
  s.appendChild(ex);
  return s;
}});

/* ---------- 6. Customer experience ---------- */
MODULES.push({ id:'m6', title:'A Good Customer Experience', build:function(){

    ['3. Fills the renewal form', 'Median 4 minutes. Satisfaction 4.2 / 5.'],
    ['4. Uploads the health certificate', '31% drop off here. Certificate is issued by another agency; most applicants do not have a digital copy and are not told they need one until this screen.'],
    ['5. Submits and waits', 'Median 11 days. No status updates sent. 1.4 hotline calls per application asking &ldquo;is it approved?&rdquo;'],

  steps.forEach(function(st){

    r.appendChild(left);
    ex.appendChild(r);
  });
  quizSet(ex, [
    { stem:'Which step would you fix first, and why?',
      opts:[
        {t:'Step 3 &mdash; keep shrinking the 4-minute form', ok:false, why:'This is the step teams love to optimise because it is theirs and the numbers are already good. Shaving a minute off a satisfying 4-minute form changes nobody’s life while a third of applicants never get past step 4.'},
        {t:'Step 4 &mdash; 31% cannot produce a document they were never told to bring', ok:true, why:'Correct. It is the largest loss in the journey, and its cause sits outside your form &mdash; another agency’s document, plus a warning that arrives too late. Fixes range from cheap (say it in the step-1 letter) to structural (fetch the certificate from the issuing agency directly). Note that the cheap fix requires no code at all.'},
        {t:'Step 6 &mdash; move the physical licence online', ok:false, why:'Plausible modernisation, but nobody in this journey complained about it, and it arrives after the hard part is over. Fix where people are actually falling out.'}
      ]},
    { stem:'Step 5: 11 days of silence and 1.4 calls per application. What does that tell you?',
      opts:[
        {t:'The hotline needs more staff to handle the calls', ok:false, why:'That treats the symptom and locks in the cost forever. The calls exist because the service withholds information the applicant needs. Staffing up makes the silence permanent and affordable.'},
        {t:'The calls are demand created by the service itself, and a status update would remove most of it', ok:true, why:'Yes &mdash; and it reframes the hotline number. Those 1.4 calls are not the public being needy; they are the cost of a design choice. This is the clearest kind of avoidable demand: caused by you, cheap to remove, and invisible unless you look at the whole journey.'}
      ]},
    { stem:'The team’s dashboard tracked only steps 2, 3 and 6. What is the general lesson?',
      opts:[

      ]}
  ], 'm6', 'Whole journey, worst case, real cost.');
  s.appendChild(ex);

MODULES.push({ id:'m7', title:'Key Takeaways & Final Quiz', build:function(){
  var s = el('section', {'class':'mod'});
  s.appendChild(el('div', {'class':'eyebrow', text:'Module 7'}));
  s.appendChild(el('h2', {text:'Key Takeaways'}));
  s.appendChild(el('p', {'class':'lede', html:'Product thinking is a discipline of asking better questions. Six of them are worth carrying into every project meeting.'}));

  var tw = el('div', {'class':'tblwrap'});
  tw.innerHTML = '<table><thead><tr><th style="width:150px">Ask</th><th>Because</th></tr></thead><tbody>' +
    '<tr><td><b>What problem, for whom?</b></td><td>If the answer is a technology, you are being handed a solution and asked to justify it backwards.</td></tr>' +
    '<tr><td><b>What does it cost today?</b></td><td>An unsized problem cannot be prioritised, and cannot be defended when budgets tighten.</td></tr>' +
    '<tr><td><b>Why does it happen?</b></td><td>Five Whys. Stop when you reach something you can change &mdash; never at a person.</td></tr>' +
    '<tr><td><b>What change would count?</b></td><td>One outcome metric and one guardrail, agreed before you build, not chosen afterwards from what looks good.</td></tr>' +
    '<tr><td><b>What are we assuming?</b></td><td>Test the high-impact, low-evidence belief first, with the cheapest thing that could prove you wrong.</td></tr>' +
    '<tr><td><b>Where does the journey actually break?</b></td><td>Usually in the parts you do not own and therefore do not measure.</td></tr>' +
    '</tbody></table>';
  s.appendChild(tw);

  var ex = exercise('Final quiz', 'Ten questions across all six modules. Answer them all to finish the pathway.');
  var qs = [
    { stem:'A director says: &ldquo;We need generative AI for our enquiry replies.&rdquo; What is the most useful first response?',
      opts:[
        {t:'Ask what is going wrong with enquiry replies today, and how we would know it improved', ok:true, why:'Problems before solutions. You are not refusing the technology &mdash; you are recovering the problem it was meant to solve, which is the only way to tell whether it will.'},
        {t:'Scope the build and estimate effort', ok:false, why:'This locks in a solution whose problem nobody has stated. If the real issue is that replies are accurate but three weeks late, drafting speed changes nothing.'},
        {t:'Explain that AI is unsuitable for government work', ok:false, why:'Unfounded and unhelpful. Product thinking is not solution-averse; it just refuses to pick one before the problem is understood.'}
      ]},
    { stem:'In the 4Cs, <b>Confirmation</b> covers:',
      opts:[
        {t:'The evidence the problem is real, and what &ldquo;solved&rdquo; would look like', ok:true, why:'Both halves matter. Evidence stops you building on anecdote; a finish line stops the project drifting into permanent maintenance.'},
        {t:'Sign-off from the steering committee', ok:false, why:'Approval is not evidence. A committee can confirm you may proceed, not that the problem exists.'},
        {t:'That the technical design will work', ok:false, why:'That is feasibility, and it belongs to a later conversation.'}
      ]},
    { stem:'&ldquo;We ran 12 workshops and trained 300 officers.&rdquo; This is:',
      opts:[
        {t:'An output', ok:true, why:'It counts what you produced. The outcome would be a measurable change in how those officers work &mdash; and you can hit the output number in full while the outcome stays at zero.'},
        {t:'An outcome', ok:false, why:'No change in anyone’s situation is described yet, only delivery.'},
        {t:'A guardrail', ok:false, why:'A guardrail warns you of harm from chasing a target. This number can only ever go up.'}
      ]},
    { stem:'Your Five Whys ends at &ldquo;the officer forgot to verify the document&rdquo;. What is wrong?',
      opts:[
        {t:'It stops at a person instead of the process that let it happen', ok:true, why:'Right. Two whys remain: why was proceeding without verification possible, and why did nothing downstream catch it? Those have fixes; &ldquo;forgot&rdquo; only has blame.'},
        {t:'Nothing &mdash; human error is a valid root cause', ok:false, why:'Human error is the beginning of the analysis. Treating it as the end produces reminder emails and repeat incidents.'},
        {t:'It needs to reach exactly five whys', ok:false, why:'The count is a heuristic. Depth is the point, not arithmetic.'}
      ]},
    { stem:'A new e-service shows 50,000 logins in month one. Counter-service queues are unchanged. Most likely reading?',
      opts:[
        {t:'Adoption is real but the intended outcome has not happened &mdash; find out who those users are', ok:true, why:'Both numbers are facts and they point in different directions. Perhaps the digital channel reached people who never queued, or people try online, fail, and come in anyway. Either way, activity is not yet benefit.'},
        {t:'The service is a clear success', ok:false, why:'The stated goal was shorter queues. Declaring victory on the metric that moved, while ignoring the one that did not, is how good projects quietly fail.'},
        {t:'The queue data must be wrong', ok:false, why:'Possible, but assuming the inconvenient number is the broken one is not analysis. Check it, do not dismiss it.'}
      ]},
    { stem:'Which assumption should you test first?',
      opts:[
        {t:'High impact if wrong, and you have little evidence either way', ok:true, why:'The riskiest-assumption principle. Maximum information for the least cost, at the moment when changing direction is still cheap.'},
        {t:'The one that is easiest to test', ok:false, why:'Tempting and busy. Easy tests on low-impact beliefs generate reassuring slides while the project-ending question stays unasked.'},
        {t:'High impact, with strong evidence already', ok:false, why:'You already know the answer. That is a constraint to design around, not a test to run.'}
      ]},
    { stem:'Why bring operations colleagues in while the problem is still being framed?',
      opts:[
        {t:'They see the workarounds and exceptions that reveal the real mechanism', ok:true, why:'Policy&ndash;Ops&ndash;Tech integration. The people running the process daily know which rule is quietly ignored and which case always breaks &mdash; that is Cause evidence you cannot get anywhere else.'},
        {t:'So they cannot object later', ok:false, why:'Consultation as insurance. It gets you attendance, not information.'},
        {t:'They will run the training', ok:false, why:'A delivery matter, and much later.'}
      ]},
    { stem:'Best guardrail for the target &ldquo;cut average call handling time by 30%&rdquo;?',
      opts:[
        {t:'Repeat-call rate for the same enquiry within 7 days', ok:true, why:'The cheapest way to hit the target is to end calls before the problem is solved &mdash; and repeat calls are exactly where that shows up. A good guardrail can contradict your headline.'},
        {t:'Number of calls answered', ok:false, why:'Rises with the same behaviour you are trying to catch, so it cannot warn you.'},
        {t:'Officer satisfaction with the new phone system', ok:false, why:'Worth knowing, but it does not detect the specific harm of rushed, unresolved calls.'}
      ]},
    { stem:'Your problem statement says the cost is &ldquo;significant staff frustration and inefficiency&rdquo;. The gap is:',
      opts:[
        {t:'Consequence is not sized &mdash; no number to prioritise or defend', ok:true, why:'&ldquo;Significant&rdquo; is a feeling, not a magnitude. Hours per week, cases reworked, dollars &mdash; a defensible estimate beats an adjective, and lets your problem compete for attention honestly.'},
        {t:'Clarity is missing', ok:false, why:'Clarity may also need work, but the flagged phrase is specifically about cost.'},
        {t:'Nothing &mdash; frustration is a real cost', ok:false, why:'It is real, and that is why it deserves a measure: turnover, rework, overtime, time-on-task.'}
      ]},
    { stem:'Product thinking is best described as:',
      opts:[
        {t:'A discipline of asking better questions before committing to a build', ok:true, why:'That is the whole pathway. Not a ceremony, not a document template &mdash; a habit of interrogating the problem until the right solution becomes obvious, and sometimes turns out to be small.'},
        {t:'A method for shipping features faster', ok:false, why:'Speed at the wrong problem just gets you to the wrong place sooner.'},
        {t:'A way to make sure every project uses AI well', ok:false, why:'Backwards. It is how you decide whether AI &mdash; or anything else &mdash; is the right answer at all.'}
      ]}
  ];
  var right = 0, ans = 0;
  var res = el('div');
  qs.forEach(function(q){
    var box = el('div', {'class':'q'});
    box.appendChild(el('p', {'class':'stem', html:q.stem}));
    var m = mcq('', q.opts, function(ok){
      ans++; if (ok) right++;
      if (ans === qs.length){
        res.innerHTML = '';
        var msg = right >= 9 ? 'You have the discipline. Now the hard part: asking these questions out loud in a meeting where a solution has already been chosen.'
          : right >= 6 ? 'Solid. Revisit the modules behind the ones you missed — the distinctions that trip people up are outcome-vs-adoption and where a Five Whys should stop.'
          : 'Worth another pass. The two ideas that carry the most weight are outcomes over outputs, and never stopping a Five Whys at a person.';
        res.appendChild(el('div', {'class':'result', html:'<b>' + right + ' / ' + qs.length + '</b>' + msg}));
        markDone('m7');
      }
    });
    m.querySelector('p').remove();
    m.style.border = '0'; m.style.background = 'none'; m.style.padding = '0'; m.style.margin = '0';
    box.appendChild(m);
    ex.appendChild(box);
  });
  ex.appendChild(res);
  s.appendChild(ex);

  var last = el('div', {'class':'card'});
  last.innerHTML = '<h4>One thing to do next</h4><p>Take the live project on your desk right now. Write its problem statement using the 4Cs from Module 2, and its one outcome metric plus one guardrail from Module 4. If either is hard to write, you have found where the project is weakest &mdash; and that is worth more than the exercise.</p>';
  s.appendChild(last);
  return s;
}});

/* ============================== router ============================== */
var current = 0;
var navEl = document.getElementById('nav');
var mainEl = document.getElementById('main');

function paintNav(){
  navEl.innerHTML = '';
  MODULES.forEach(function(m, i){
    var b = el('button', {type:'button'});
    b.setAttribute('data-done', state.done[m.id] ? '1' : '0');
    if (i === current) b.setAttribute('aria-current', 'true');
    var n = el('div', {'class':'num', text: state.done[m.id] ? '✓' : String(i + 1)});
    b.appendChild(n);
    b.appendChild(el('span', {text:m.title}));
    b.addEventListener('click', function(){ go(i); });
    navEl.appendChild(b);
  });
  var d = MODULES.filter(function(m){ return state.done[m.id]; }).length;
  var pct = Math.round(d / MODULES.length * 100);
  document.getElementById('progtxt').textContent = d + ' of ' + MODULES.length + ' done';
  document.getElementById('ringtxt').textContent = pct + '%';
  document.getElementById('ring').style.setProperty('--pct', pct + '%');
}

function go(i){
  current = i;
  mainEl.innerHTML = '';
  var sec = MODULES[i].build();

  var nav = el('div', {'class':'footnav'});
  nav.appendChild(i > 0
    ? el('button', {'class':'btn', type:'button', text:'← ' + MODULES[i-1].title, on:{click:function(){ go(i-1); }}})
    : el('span'));
  nav.appendChild(i < MODULES.length - 1
    ? el('button', {'class':'btn primary', type:'button', text:MODULES[i+1].title + ' →', on:{click:function(){ go(i+1); }}})
    : el('span'));
  sec.appendChild(nav);

  mainEl.appendChild(sec);
  paintNav();
  window.scrollTo({top:0, behavior:'smooth'});
}

document.getElementById('reset').addEventListener('click', function(){
  if (!confirm('Clear all progress and saved drafts?')) return;
  state = { done:{}, notes:{} };
  save();
  go(0);
});

paintNav();
go(0);
</script>
